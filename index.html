<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Hamad’s Heart</title>

<style>
  :root{
    --accent:#ff4fa3;
    --accent2:#ff86c6;
    --pink1:#ffd1e6;
    --pink2:#ffb3d9;
    --ink:#7a1e4f;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; }
  body{ background:#000; overflow:hidden; font-family:-apple-system,BlinkMacSystemFont,system-ui,Segoe UI,Roboto,Arial,sans-serif; }

  /* ===== CINEMA ===== */
  .cinema{ position:fixed; inset:0; background:#000; }
  .bg{
    position:absolute; inset:-10%;
    background-size:cover;
    background-position:center;
    transform: scale(1.12);
    filter: brightness(.72) contrast(1.06) saturate(1.06);
    transition: opacity 1.2s ease;
    opacity:0;
  }
  .bg.show{ opacity:1; }
  .bg.move{ animation: kenburns 8.8s ease-in-out forwards; }
  @keyframes kenburns{
    0%{ transform: scale(1.12) translate3d(0,0,0); }
    100%{ transform: scale(1.02) translate3d(var(--kx, 12px), var(--ky, -10px), 0); }
  }
  .vignette{ position:absolute; inset:0; box-shadow: inset 0 0 180px rgba(0,0,0,.85); pointer-events:none; }
  .fadeTop{ position:absolute; inset:0; background: linear-gradient(to top, rgba(0,0,0,.74), rgba(0,0,0,.18)); pointer-events:none; }
  .grain{
    position:absolute; inset:0; pointer-events:none;
    background-image: repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 3px);
    opacity:.14; mix-blend-mode: overlay;
    animation: grain 1.4s steps(2) infinite;
  }
  @keyframes grain{ 0%{transform:translate(0,0)} 50%{transform:translate(-6px,4px)} 100%{transform:translate(4px,-5px)} }

  .captionWrap{
    position:absolute; left:0; right:0;
    bottom: clamp(34px, 10vh, 82px);
    padding: 0 18px;
    display:flex; justify-content:center;
    pointer-events:none;
  }
  .caption{
    width:min(980px, 96vw);
    text-align:center;
    color:#fff;
    opacity:0;
    transform: translateY(12px);
    transition: opacity 1.0s ease, transform 1.0s ease;
    text-shadow: 0 14px 40px rgba(0,0,0,.60);
  }
  .caption.show{ opacity:1; transform:translateY(0); }
  .capEyebrow{ font-weight:900; letter-spacing:.32em; text-transform:uppercase; font-size:12px; opacity:.84; }
  .capTitle{ margin-top:10px; font-size: clamp(26px, 7vw, 58px); font-weight: 1000; line-height:1.05; }
  .capBody{ margin-top:12px; font-size: clamp(14px, 3.8vw, 20px); opacity:.94; line-height:1.35; }

  /* memory left/right style */
  .caption.mem{ text-align:left; }
  .caption.mem.right{ text-align:right; }
  .memTag{
    display:inline-flex; align-items:center; gap:10px;
    padding: 10px 14px; border-radius:999px;
    border:1px solid rgba(255,255,255,.22);
    background: rgba(0,0,0,.28);
    font-weight:900; letter-spacing:.18em; text-transform:uppercase;
    font-size: 11px; opacity:.92;
  }
  .memLine{
    margin-top:12px;
    font-size: clamp(18px, 5.2vw, 34px);
    font-weight: 1000;
    line-height:1.12;
  }

  /* ===== FADE CURTAIN ===== */
  .curtain{
    position:fixed; inset:0;
    background: radial-gradient(1200px 900px at 50% 30%, rgba(255,255,255,.06), rgba(0,0,0,1));
    opacity:0; pointer-events:none;
    transition: opacity 1.1s ease;
    z-index:20;
  }
  .curtain.on{ opacity:1; }

  /* ===== VALENTINE ===== */
  .valentine{
    position:fixed; inset:0;
    display:none; /* IMPORTANT: hidden until cinema ends */
    background:
      radial-gradient(1100px 700px at 20% 10%, rgba(255,255,255,.55), transparent 60%),
      radial-gradient(900px 600px at 80% 20%, rgba(255,255,255,.45), transparent 55%),
      linear-gradient(135deg, var(--pink1), var(--pink2));
    color: var(--ink);
    overflow:hidden;
    padding: max(18px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom));
    align-items:center;
    justify-content:center;
    z-index:30;
  }

  .hearts{ position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .heart{
    position:absolute; width:18px; height:18px;
    transform: rotate(45deg);
    background: rgba(255, 79, 163, .22);
    animation: floatUp linear infinite;
    filter: drop-shadow(0 6px 8px rgba(255,79,163,.18));
  }
  .heart::before, .heart::after{
    content:""; position:absolute;
    width:18px; height:18px; border-radius:50%;
    background: inherit;
  }
  .heart::before{ left:-9px; top:0; }
  .heart::after{ top:-9px; left:0; }
  @keyframes floatUp{
    from{ transform: translateY(110svh) rotate(45deg); opacity:0; }
    10%{ opacity:1; }
    to{ transform: translateY(-15svh) rotate(45deg); opacity:0; }
  }

  .card{
    width:min(820px, 100%);
    background: linear-gradient(180deg, rgba(255,255,255,.92), rgba(255,255,255,.78));
    border:1px solid rgba(255, 79, 163, .20);
    border-radius:28px;
    padding: clamp(18px, 4vw, 34px);
    box-shadow: 0 18px 60px rgba(122, 30, 79, .18), inset 0 1px 0 rgba(255,255,255,.75);
    backdrop-filter: blur(10px);
    text-align:center;
    animation: popIn 0.9s cubic-bezier(.2,1.2,.3,1) both;
    position:relative;
    z-index:2;
  }
  @keyframes popIn{
    0%{ transform: translateY(14px) scale(.92); opacity:0; }
    100%{ transform: translateY(0) scale(1); opacity:1; }
  }
  .badge{
    display:inline-flex; gap:10px; align-items:center; justify-content:center;
    padding:10px 14px; border-radius:999px;
    background: rgba(255, 79, 163, .10);
    border:1px solid rgba(255, 79, 163, .18);
    font-weight:900;
    margin-bottom:14px;
    font-size: 14px;
  }
  .badge .dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 14px rgba(255,79,163,.7);
  }
  h1{ margin: 6px 0 10px; font-size: clamp(26px, 7vw, 50px); line-height:1.05; }
  .sub{ margin: 0 0 18px; font-size: clamp(14px, 3.6vw, 18px); opacity:.85; }

  .buttons{ display:grid; grid-template-columns: 1fr; gap: 12px; margin-top: 10px; }
  @media (min-width: 560px){ .buttons{ grid-template-columns: 1fr 1fr; } }

  button{
    border:0; width:100%; cursor:pointer;
    padding: 16px 16px;
    border-radius: 18px;
    font-size: 16px;
    font-weight: 900;
    line-height: 1.2;
    min-height: 58px;
    transition: transform .20s ease, box-shadow .20s ease, background .35s ease;
    box-shadow: 0 10px 22px rgba(255,79,163,.18);
    user-select:none;
    touch-action: manipulation;
  }
  button:active{ transform: scale(0.985); }
  .btnSoft{
    background: linear-gradient(135deg, #ffe3f1, #ffd6ea);
    color: #8a2b5d;
    border: 1px solid rgba(255,79,163,.25);
  }
  .btnHot{
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color:white;
    border: 1px solid rgba(255,255,255,.35);
    box-shadow: 0 16px 30px rgba(255,79,163,.30);
  }

  .dialog{
    margin-top: 14px;
    display:flex;
    flex-direction:column;
    gap:10px;
    min-height: 92px;
  }
  .bubble{
    width: fit-content;
    max-width: 92%;
    padding: 12px 14px;
    border-radius: 16px;
    font-weight: 900;
    letter-spacing: .01em;
    opacity:0;
    transform: translateY(6px);
    transition: opacity .7s ease, transform .7s ease;
  }
  .bubble.show{ opacity:1; transform:translateY(0); }
  .bubble.left{
    background: rgba(255,255,255,.78);
    border:1px solid rgba(255,79,163,.22);
    color: #7a1e4f;
    align-self:flex-start;
  }
  .bubble.right{
    background: linear-gradient(135deg, rgba(255,79,163,.85), rgba(255,134,198,.85));
    border:1px solid rgba(255,255,255,.35);
    color:#fff;
    align-self:flex-end;
  }

  .footer{ margin-top:14px; font-size: 13px; opacity:.72; }

  /* heart explosion */
  .burst{ position:fixed; inset:0; pointer-events:none; z-index:40; }
  .puff{
    position:absolute;
    width:14px; height:14px;
    transform: rotate(45deg);
    background: rgba(255, 79, 163, .55);
    filter: drop-shadow(0 10px 14px rgba(255,79,163,.25));
    animation: puff 1.5s cubic-bezier(.15,.9,.2,1) forwards;
  }
  .puff::before, .puff::after{
    content:"";
    position:absolute;
    width:14px; height:14px;
    border-radius:50%;
    background: inherit;
  }
  .puff::before{ left:-7px; top:0; }
  .puff::after{ top:-7px; left:0; }
  @keyframes puff{
    0%   { transform: translate(0,0) rotate(45deg) scale(.9); opacity:0; }
    10%  { opacity:1; }
    100% { transform: translate(var(--dx), var(--dy)) rotate(45deg) scale(1.25); opacity:0; }
  }

  .preloadNote{
    position:fixed; left:12px; top:12px;
    color:#fff; font-size:12px; opacity:.7;
    z-index:5;
    text-shadow:0 10px 30px rgba(0,0,0,.8);
    pointer-events:none;
  }
</style>
</head>

<body>

<div class="preloadNote" id="preloadNote">Loading…</div>

<!-- CINEMA -->
<div class="cinema" id="cinema">
  <div class="bg" id="bg"></div>
  <div class="grain"></div>
  <div class="fadeTop"></div>
  <div class="vignette"></div>

  <div class="captionWrap">
    <div class="caption" id="caption">
      <div class="capEyebrow" id="capEyebrow"></div>
      <div class="capTitle" id="capTitle"></div>
      <div class="capBody" id="capBody"></div>
    </div>
  </div>
</div>

<div class="curtain" id="curtain"></div>

<!-- VALENTINE -->
<div class="valentine" id="valentine">
  <div class="hearts" id="hearts"></div>

  <div class="card">
    <div class="badge"><span class="dot"></span> cute & cozy mode</div>

    <h1 id="qTitle">Will you be my valentine? 💗</h1>
    <div class="sub" id="qSub">Choose carefully 😌</div>

    <div class="buttons">
      <button id="btnYes" class="btnHot" type="button">Yes</button>
      <button id="btnNo" class="btnSoft" type="button">No</button>
    </div>

    <div class="dialog" id="dialog"></div>

    <div class="footer">WELCOME TO HAMAD’S HEART ✨</div>
  </div>
</div>

<div class="burst" id="burst"></div>

<script>
/* =========================================================
   EDIT FILENAMES HERE (must match your GitHub repo files)
   Upload these images into the repo root:
   - scene-raccoon.png
   - scene-police.png
   - scene-heart.png
   - 01-badminton.png
   - 02-weapons-2025.png
   - 03-portal2.png
   - 04-gym.png
   - 05-kbbq.png
   - 06-hiking-japan.png
   - 07-shopping.png
   - 08-basketball.png
   - 09-cozy-bath.png
   - 10-lng26-exxonbooth.png
   - 11-tennis-2026-gate.png
========================================================= */
const IMG_RACCOON = "./scene-raccoon.png";
const IMG_POLICE  = "./scene-police.png";
const IMG_HEART   = "./scene-heart.png";

const HER_NAME = "Sara Hassan Al-Ansari";

/* ===== Cinema Elements ===== */
const preloadNote = document.getElementById("preloadNote");
const cinema = document.getElementById("cinema");
const bg = document.getElementById("bg");

const caption = document.getElementById("caption");
const capEyebrow = document.getElementById("capEyebrow");
const capTitle = document.getElementById("capTitle");
const capBody = document.getElementById("capBody");

const curtain = document.getElementById("curtain");
const valentine = document.getElementById("valentine");

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

function setKenBurnsVector(){
  const kx = (Math.random()*26 - 13).toFixed(0) + "px";
  const ky = (Math.random()*22 - 11).toFixed(0) + "px";
  bg.style.setProperty("--kx", kx);
  bg.style.setProperty("--ky", ky);
}

function hideCaption(){ caption.classList.remove("show"); }

function showCaption({eyebrow="", title="", body="", mode="normal", side="left", tag=""}){
  capEyebrow.textContent = eyebrow;
  capTitle.textContent = title;
  capBody.textContent = body;

  caption.className = "caption";
  if (mode === "memory"){
    caption.classList.add("mem");
    if (side === "right") caption.classList.add("right");
    capEyebrow.textContent = "";
    capTitle.innerHTML = `<span class="memTag">${tag}</span>`;
    capBody.innerHTML = `<div class="memLine">${body}</div>`;
  }
  requestAnimationFrame(()=> caption.classList.add("show"));
}

function setBackground(url, darker=false){
  bg.classList.remove("show", "move");
  bg.style.filter = darker
    ? "brightness(.58) contrast(1.07) saturate(1.02)"
    : "brightness(.72) contrast(1.06) saturate(1.06)";
  bg.style.backgroundImage = `url("${url}")`;
  setKenBurnsVector();
  requestAnimationFrame(()=>{
    bg.classList.add("show");
    bg.classList.add("move");
  });
}

async function preloadImages(urls){
  const unique = [...new Set(urls)];
  await Promise.all(unique.map(u => new Promise(resolve=>{
    const img = new Image();
    img.onload = img.onerror = resolve;
    img.src = u;
  })));
}

/* =========================================================
   SCENES (ordered exactly like you requested)
   The “memory lane” section is ~40 seconds total.
========================================================= */
const scenes = [
  // Sara-only warning
  {
    img: IMG_HEART, ms: 6500,
    eyebrow: "PERSONALIZED",
    title: `This is a personalized message to ${HER_NAME}.`,
    body: "If you are not her, please exit immediately."
  },

  // Confirmation / memory lane duration
  {
    img: IMG_HEART, ms: 7000,
    eyebrow: "GOOD",
    title: "Now that I know it’s you…",
    body: "I would like to take you down memory lane for about 40 seconds."
  },

  // unfortunate stop
  {
    img: IMG_HEART, ms: 6500,
    eyebrow: "ONE THING",
    title: "Before we go to Hamad’s heart…",
    body: "We have to take an unfortunate stop first."
  },

  // Raccoon city + police department vibe (original visuals you upload)
  { img: IMG_RACCOON, ms: 6500, eyebrow:"DET0UR", title:"WELCOME TO RACCOON CITY", body:"Stay close… just for a moment.", darker:true },
  { img: IMG_POLICE,  ms: 6500, eyebrow:"SAFEHOUSE", title:"THE POLICE DEPARTMENT", body:"Quiet halls… steady heartbeat.", darker:true },

  // Welcome to Hamad’s Heart
  {
    img: IMG_HEART, ms: 6500,
    eyebrow: "RETURNING",
    title: "WELCOME TO HAMAD’S HEART",
    body: `Welcome back, ${HER_NAME}.`
  },

  // Guided line
  {
    img: IMG_HEART, ms: 6500,
    eyebrow: "GUIDED",
    title: `${HER_NAME}, today you will be guided…`,
    body: "…through the alley of fondest memories."
  },

  // ===== Memory lane (~40 seconds total) =====
  { img:"./01-badminton.png",       ms: 4000, mode:"memory", side:"left",  tag:"LEFT • SPORT",   body:"Badminton. Laughter. Shared breath." },
  { img:"./02-weapons-2025.png",     ms: 4000, mode:"memory", side:"right", tag:"RIGHT • MOVIE",  body:"Movie night — Weapons (2025)." },
  { img:"./03-portal2.png",          ms: 4000, mode:"memory", side:"left",  tag:"LEFT • GAME",    body:"Portal 2. Two minds. One team." },
  { img:"./04-gym.png",              ms: 4000, mode:"memory", side:"right", tag:"RIGHT • GYM",    body:"Working out together. Stronger together." },
  { img:"./05-kbbq.png",             ms: 4000, mode:"memory", side:"left",  tag:"LEFT • DINNER",  body:"Korean BBQ. Late talks. Warm smiles." },
  { img:"./06-hiking-japan.png",     ms: 4000, mode:"memory", side:"right", tag:"RIGHT • JAPAN",  body:"Hiking in Japan. Quiet promises." },
  { img:"./07-shopping.png",         ms: 4000, mode:"memory", side:"left",  tag:"LEFT • SHOPPING",body:"Shopping together. Little joys." },
  { img:"./08-basketball.png",       ms: 4000, mode:"memory", side:"right", tag:"RIGHT • SPORT",  body:"Basketball. Playful competition." },
  { img:"./09-cozy-bath.png",        ms: 4000, mode:"memory", side:"left",  tag:"LEFT • HOME",    body:"A warm, safe moment… just you two." },
  { img:"./10-lng26-exxonbooth.png", ms: 4000, mode:"memory", side:"right", tag:"RIGHT • LNG26",  body:"LNG26 — ExxonMobil booth. Proud of her." },

  // Gate moment
  { img:"./11-tennis-2026-gate.png", ms: 6000, eyebrow:"AHEAD", title:"WELCOME TO EXXONMOBIL’S TENNIS 2026", body:"Hand in hand… and proud." },
];

async function runCinema(){
  await preloadImages(scenes.map(s => s.img));
  preloadNote.style.display = "none";

  for (let i=0; i<scenes.length; i++){
    const s = scenes[i];
    setBackground(s.img, !!s.darker);
    hideCaption();
    await sleep(400);
    showCaption(s);
    await sleep(s.ms);
  }

  // transition to valentine
  curtain.classList.add("on");
  await sleep(850);
  cinema.style.display = "none";
  valentine.style.display = "flex";
  curtain.classList.remove("on");
  spawnHearts();
}

/* ===== Valentine Effects ===== */
const hearts = document.getElementById("hearts");
const burst = document.getElementById("burst");

function spawnHearts(){
  hearts.innerHTML = "";
  const count = 22;
  for (let i=0;i<count;i++){
    const h = document.createElement("div");
    h.className = "heart";
    const left = Math.random()*100;
    const size = 12 + Math.random()*18;
    const dur  = 10 + Math.random()*12;
    const delay= Math.random()*5;
    h.style.left = left+"vw";
    h.style.width = size+"px";
    h.style.height= size+"px";
    h.style.animationDuration = dur+"s";
    h.style.animationDelay = delay+"s";
    h.style.background = `rgba(255, 79, 163, ${0.10 + Math.random()*0.22})`;
    hearts.appendChild(h);
  }
}

function heartExplosion(x,y){
  const count = 60;
  for(let i=0;i<count;i++){
    const p = document.createElement("div");
    p.className = "puff";
    const angle = Math.random()*Math.PI*2;
    const dist  = 120 + Math.random()*260;
    const dx = Math.cos(angle)*dist;
    const dy = Math.sin(angle)*dist;
    p.style.left = x+"px";
    p.style.top  = y+"px";
    p.style.setProperty("--dx", dx+"px");
    p.style.setProperty("--dy", dy+"px");
    const size = 10 + Math.random()*22;
    p.style.width = size+"px";
    p.style.height= size+"px";
    const alpha = 0.26 + Math.random()*0.55;
    p.style.background = `rgba(255, 79, 163, ${alpha})`;
    burst.appendChild(p);
    setTimeout(()=>p.remove(), 1600);
  }
}

function pointerXY(evt){
  let x = innerWidth/2, y = innerHeight/2;
  if (evt?.touches?.[0]){ x = evt.touches[0].clientX; y = evt.touches[0].clientY; }
  if (evt?.clientX != null){ x = evt.clientX; y = evt.clientY; }
  return {x,y};
}

/* ===== Valentine Logic (your exact mind-game) ===== */
const btnYes = document.getElementById("btnYes");
const btnNo  = document.getElementById("btnNo");
const dialog = document.getElementById("dialog");
const qTitle = document.getElementById("qTitle");
const qSub   = document.getElementById("qSub");

let phase = 1; // 1 = first question, 2 = re-asked question

function clearDialog(){ dialog.innerHTML = ""; }

function addBubble(text, side){
  const b = document.createElement("div");
  b.className = "bubble " + (side === "right" ? "right" : "left");
  b.textContent = text;
  dialog.appendChild(b);
  requestAnimationFrame(()=> b.classList.add("show"));
  return b;
}

async function runYesChain(evt){
  const {x,y} = pointerXY(evt);
  heartExplosion(x,y);

  // turn YES into the sweet line
  btnYes.textContent = "Yes my sweet handsome man";
  btnYes.classList.remove("btnHot");
  btnYes.classList.add("btnHot");

  // dialogue chain
  clearDialog();
  addBubble("i cant believe you said Yes", "left");
  await sleep(900);
  addBubble("Yes, You did", "right");
  await sleep(900);
  addBubble("Okay okay, lets go back to the question since you cant remember what you chose", "left");
  await sleep(1400);

  // reset to phase 2
  phase = 2;
  qTitle.textContent = "Will you be my valentine? 💗";
  qSub.textContent   = "Okay… try again 😌";
  btnYes.textContent = "Yes";
  btnNo.textContent  = "No";
  clearDialog();
}

async function runNoPhase2(evt){
  const {x,y} = pointerXY(evt);
  heartExplosion(x,y);

  btnNo.textContent = "I will always be your valentine and your gorgeous girl";
  btnNo.classList.remove("btnSoft");
  btnNo.classList.add("btnHot");

  // lock both
  btnYes.disabled = true;
  btnNo.disabled = true;

  clearDialog();
  addBubble(`Test passed. Welcome home, ${HER_NAME}.`, "right");
}

async function onYes(evt){
  if (phase === 1){
    await runYesChain(evt);
    return;
  }
  // phase 2: if she presses yes again, just be cute
  const {x,y} = pointerXY(evt);
  heartExplosion(x,y);
  clearDialog();
  addBubble("You really like that button huh 😌", "left");
}

async function onNo(evt){
  if (phase === 1){
    // gentle tease
    const {x,y} = pointerXY(evt);
    heartExplosion(x,y);
    clearDialog();
    addBubble("No? …I’m not buying it.", "left");
    addBubble("Try again 😌", "right");
    return;
  }
  // phase 2: the real payoff
  await runNoPhase2(evt);
}

["touchstart","pointerdown"].forEach(ev=>{
  btnYes.addEventListener(ev, onYes, {passive:true});
  btnNo.addEventListener(ev, onNo, {passive:true});
});
btnYes.addEventListener("click", (e)=>{ e.preventDefault(); onYes(e); });
btnNo.addEventListener("click", (e)=>{ e.preventDefault(); onNo(e); });

runCinema();
</script>
</body>
</html>
